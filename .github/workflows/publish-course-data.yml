name: Publish Course Data

on:
  workflow_dispatch:
    inputs:
      promotion_commit:
        description: 'Full SHA of the successful, reviewed promotion commit'
        required: true
        type: string
      request_id:
        description: 'Stable release ID (lowercase letters/digits/hyphens); reuse when retrying'
        required: true
        type: string
      channel:
        description: 'Production is restricted to the organisation; staging to the development fork'
        required: true
        default: staging
        type: choice
        options: [staging, production]
      rollback:
        description: 'Explicitly approve publishing older data under a NEW request ID and sequence'
        type: boolean
        default: false

permissions: {}

# One writer, including deployment and post-deployment verification. Never cancel
# a release between recording its sequence and deploying its pointer.
concurrency:
  group: course-data-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/master' &&
      ((inputs.channel == 'production' && github.repository == 'SMKIDRaadet/dtu-course-analyzer') ||
       (inputs.channel == 'staging' && github.repository == 'SalisMaxima/dtu-course-analyzer'))
    environment: course-data-${{ inputs.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      ledger_commit: ${{ steps.ledger.outputs.commit }}
    env:
      PYTHONPATH: src
      RELEASE_CHANNEL: ${{ inputs.channel }}
      PROMOTION_COMMIT: ${{ inputs.promotion_commit }}
      RELEASE_REQUEST_ID: ${{ inputs.request_id }}
      CONTROLLED_ROLLBACK: ${{ inputs.rollback }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check explicit environment enablement and reviewed configuration
        env:
          RELEASE_ENABLED: ${{ vars.COURSE_DATA_PUBLICATION_ENABLED }}
        run: |
          test "$RELEASE_ENABLED" = 'true'
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['PROMOTION_COMMIT']):
              raise SystemExit('A full promotion commit SHA is required')
          if not re.fullmatch(r'[a-z0-9][a-z0-9-]{0,63}', os.environ['RELEASE_REQUEST_ID']):
              raise SystemExit('Invalid release request ID')
          config = json.loads(Path('config/course-data-release.json').read_text())[os.environ['RELEASE_CHANNEL']]
          if not config['origin'] or config['signing_key_id'] not in config['trusted_keys']:
              raise SystemExit('Confirm the endpoint and commit reviewed public keys before publication')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install locked signing dependencies without exposing the signing secret
        run: python -m pip install --require-hashes -r requirements-release.txt

      - name: Read the selected promotion receipt
        run: |
          git show "$PROMOTION_COMMIT:data/course-data-promotion.json" > "$RUNNER_TEMP/promotion-receipt.json"

      - name: Obtain promotion status and protected environment approval history
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const temp = process.env.RUNNER_TEMP;
            const receipt = JSON.parse(fs.readFileSync(`${temp}/promotion-receipt.json`, 'utf8'));
            const runId = String(receipt.promotion.run_id);
            if (!/^[1-9][0-9]*$/.test(runId)) throw new Error('Invalid promotion run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            fs.writeFileSync(`${temp}/promotion-run.json`, JSON.stringify(run));
            const {data: reviews} = await github.request(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/approvals',
              {...context.repo, run_id: context.runId});
            fs.writeFileSync(`${temp}/publication-approval.json`, JSON.stringify({
              environment: `course-data-${process.env.RELEASE_CHANNEL}`,
              run_id: String(context.runId), run_attempt: process.env.GITHUB_RUN_ATTEMPT,
              requested_by: context.actor, workflow_sha: context.sha, reviews
            }));

      - name: Open the durable release ledger
        run: |
          ledger_branch="course-data-releases-$RELEASE_CHANNEL"
          if git show-ref --verify --quiet "refs/remotes/origin/$ledger_branch"; then
            git worktree add --detach "$RUNNER_TEMP/release-ledger" "refs/remotes/origin/$ledger_branch"
          else
            git worktree add --detach "$RUNNER_TEMP/release-ledger" HEAD
            git -C "$RUNNER_TEMP/release-ledger" switch --orphan "$ledger_branch"
          fi

      - name: Verify promotion and prepare or reuse the signed release
        env:
          COURSE_DATA_SIGNING_KEY: ${{ secrets.COURSE_DATA_SIGNING_KEY }}
        run: |
          rollback_args=()
          if [ "$CONTROLLED_ROLLBACK" = 'true' ]; then rollback_args+=(--rollback); fi
          python -m dtu_analyzer.scripts.publish_course_data package \
            --ledger "$RUNNER_TEMP/release-ledger" --channel "$RELEASE_CHANNEL" \
            --commit "$PROMOTION_COMMIT" --request-id "$RELEASE_REQUEST_ID" \
            --promotion-run "$RUNNER_TEMP/promotion-run.json" \
            --approval "$RUNNER_TEMP/publication-approval.json" "${rollback_args[@]}"

      - name: Persist signed bytes and evidence before attempting deployment
        id: ledger
        run: |
          git -C "$RUNNER_TEMP/release-ledger" add -- index.json public evidence
          if ! git -C "$RUNNER_TEMP/release-ledger" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/release-ledger" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Record signed course-data release $RELEASE_REQUEST_ID"
            git -C "$RUNNER_TEMP/release-ledger" push origin "HEAD:refs/heads/course-data-releases-$RELEASE_CHANNEL"
          fi
          echo "commit=$(git -C "$RUNNER_TEMP/release-ledger" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'Signed release recorded. Public deployment has not yet been verified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Export only the verified public file allowlist
        run: >-
          python -m dtu_analyzer.scripts.publish_course_data export
          --ledger "$RUNNER_TEMP/release-ledger" --channel "$RELEASE_CHANNEL"
          --output "$RUNNER_TEMP/public-course-data"

      - name: Build the Pages tar from the verified allowlist
        run: tar --directory "$RUNNER_TEMP/public-course-data" --create --file "$RUNNER_TEMP/artifact.tar" .

      # Pin the underlying uploader as well, avoiding a floating composite dependency.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: prepare
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy immutable payloads and current pointer together
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      RELEASE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.ledger_commit }}
          path: release-ledger
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Verify the public HTTPS pointer and immutable payload
        run: |
          python -m dtu_analyzer.scripts.publish_course_data verify \
            --ledger release-ledger --channel "$RELEASE_CHANNEL"
          echo 'Publication succeeded: the deployed HTTPS pointer, signature, schema and exact payload bytes were verified.' >> "$GITHUB_STEP_SUMMARY"

  report:
    if: always()
    needs: [prepare, deploy, verify]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report the publication state independently of promotion
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          echo "Publication preparation: $PREPARE_RESULT; deployment: $DEPLOY_RESULT; public verification: $VERIFY_RESULT." >> "$GITHUB_STEP_SUMMARY"
          if [ "$VERIFY_RESULT" != 'success' ]; then
            echo 'Publication is NOT verified. Repository promotion is a separate state. Fix the failure and retry with the same request ID; do not scrape again.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
