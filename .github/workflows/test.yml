name: Run Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.3'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"  # Install package with CLI tools and dev dependencies (pytest)

      - name: Run tests
        run: pytest -v --tb=short

      - name: Run extension tests
        run: |
          npm ci --ignore-scripts
          node --test tests/*.test.js

      - name: Run validator on sample data (if exists)
        run: |
          if [ -f "data/coursedic.json" ]; then
            dtu-validate data/coursedic.json
          else
            echo "No data/coursedic.json found, skipping validation"
          fi
