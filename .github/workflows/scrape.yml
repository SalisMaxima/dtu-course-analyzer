name: Update Course Data

on:
  workflow_dispatch:
    inputs:
      repair_run_id:
        description: 'Optional: ID of a failed run from the last 7 days to repair. Reuses its scrape and collects only missing or flagged courses again.'
        required: false
        type: string
        default: ''

concurrency:
  group: course-data-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MAX_CONCURRENT: "2"
      REPAIR_RUN_ID: ${{ inputs.repair_run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.3'  # Recommended: 3.12+, minimum: 3.10
          cache: 'pip'  # Built-in pip caching

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .  # Install package with CLI tools

      - name: Read repair source run metadata
        if: inputs.repair_run_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const runId = process.env.REPAIR_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(runId)) {
              throw new Error('Repair run ID must be a positive integer');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: runId
            });
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'repair-run.json'), JSON.stringify(run));

      - name: Check repair source before download
        if: inputs.repair_run_id != ''
        run: |
          git fetch --no-tags --depth=1 origin "$(jq -r .head_sha "$RUNNER_TEMP/repair-run.json")"
          python -m dtu_analyzer.scripts.prepare_repair check \
            --run-metadata "$RUNNER_TEMP/repair-run.json" --repository "$GITHUB_REPOSITORY" \
            --run-id "$REPAIR_RUN_ID" --branch "$GITHUB_REF_NAME"

      - name: Download repair source data
        if: inputs.repair_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: course-data-candidate
          run-id: ${{ inputs.repair_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/repair-source

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Authenticate and get cookie
        env:
          DTU_USERNAME: ${{ secrets.DTU_USERNAME }}
          DTU_PASSWORD: ${{ secrets.DTU_PASSWORD }}
        run: dtu-auth

      - name: Update Course Numbers
        run: dtu-get-courses

      - name: Seed scraper checkpoint from repair source
        if: inputs.repair_run_id != ''
        run: |
          python -m dtu_analyzer.scripts.prepare_repair seed \
            --candidate "$RUNNER_TEMP/repair-source" --course-file data/coursenumbers.txt \
            --output data/coursedic.partial.json
          echo "RESUME=1" >> "$GITHUB_ENV"

      - name: Run Scraper
        run: dtu-scrape

      - name: Validate Scraped Data
        run: dtu-validate data/coursedic.json

      - name: Collect exam histories and schedule evidence
        run: python -m dtu_analyzer.scripts.probe_exam_classification --output exam-classification-report

      - name: Build and validate candidate
        run: >-
          python -m dtu_analyzer.scripts.build_production_candidate
          --raw data/coursedic.json --report exam-classification-report/report.json
          --course-file data/coursenumbers.txt --output dist/production-candidate

      - name: Upload candidate
        id: candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-data-candidate
          path: dist/production-candidate/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-classification-report
          path: exam-classification-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Record promotion identifiers
        if: success()
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_URL: ${{ steps.candidate.outputs.artifact-url }}
        run: |
          echo 'Candidate created. Review and test it before running Promote Course Data.' >> "$GITHUB_STEP_SUMMARY"
          echo "Run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REPAIR_RUN_ID" ]; then
            echo "Repaired from run: $REPAIR_RUN_ID (its scraped course data was reused)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Artifact ID: $CANDIDATE_ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: $CANDIDATE_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
