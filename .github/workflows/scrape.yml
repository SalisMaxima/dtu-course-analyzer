name: Update Course Data

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish validated data (leave off until the candidate has been reviewed)'
        type: boolean
        default: false

concurrency:
  group: course-data-update-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MAX_CONCURRENT: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.3'  # Recommended: 3.12+, minimum: 3.10
          cache: 'pip'  # Built-in pip caching

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .  # Install package with CLI tools

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Authenticate and get cookie
        env:
          DTU_USERNAME: ${{ secrets.DTU_USERNAME }}
          DTU_PASSWORD: ${{ secrets.DTU_PASSWORD }}
        run: dtu-auth

      - name: Update Course Numbers
        run: dtu-get-courses

      - name: Run Scraper
        run: dtu-scrape

      - name: Validate Scraped Data
        run: dtu-validate data/coursedic.json

      - name: Collect exam histories and schedule evidence
        run: python -m dtu_analyzer.scripts.probe_exam_classification --output exam-classification-report

      - name: Build and validate candidate (dry run)
        if: ${{ !inputs.publish }}
        run: >-
          python -m dtu_analyzer.scripts.build_production_candidate
          --raw data/coursedic.json --report exam-classification-report/report.json
          --course-file data/coursenumbers.txt --output dist/production-candidate

      - name: Build, validate and publish dataset
        if: ${{ inputs.publish }}
        run: >-
          python -m dtu_analyzer.scripts.build_production_candidate
          --raw data/coursedic.json --report exam-classification-report/report.json
          --course-file data/coursenumbers.txt --output dist/production-candidate --publish

      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-data-candidate
          path: |
            dist/production-candidate/
            exam-classification-report/
          if-no-files-found: warn

      - name: Commit and Push changes
        if: ${{ inputs.publish && success() }}
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update course data [skip ci]"
          file_pattern: "data/coursenumbers.txt data/coursedic.json extension/db/data.json"
